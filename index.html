<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Candy Snake</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍬</text></svg>"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* Must match the Phaser backgroundColor. Scale.RESIZE leaves no
           letterbox bars, but the page still shows through for the frame or two
           before the canvas is sized. */
        background: #d8cbe4;
        overscroll-behavior: none;
      }
      /* The canvas fills this, and every scene lays itself out from its real
         size (architecture §9) — so there is nothing left over to centre. */
      #app {
        height: 100%;
      }
      #app canvas {
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
